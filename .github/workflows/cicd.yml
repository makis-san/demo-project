# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    # The suite runs on one worker and takes about 19 minutes, so 20 left no room for a slower runner.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: setlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The dev server does not read these from .env, so they are set here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/setlist
      ENVIRONMENT: development
      VITE_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      # The app runs on Node. The Docker image uses Node 22, so use the same here.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Apply migrations
        run: bunx prisma migrate deploy
      # The built-in movements are rows written from the catalog in code, so the tests need them.
      - name: Seed the built-in movements
        run: bun scripts/seed-movements.ts
      # The same command the Docker image runs. Playwright's config expects the app on port 3000.
      - name: Start the app
        run: |
          nohup bunx vite dev --host 0.0.0.0 --port 3000 > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 2
          done
          echo "The app did not start in 2 minutes. Its log:"
          cat server.log
          exit 1
      # CI is set by GitHub, so Playwright runs with one worker and two retries.
      - name: Run e2e tests
        run: bun run test
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            server.log
          retention-days: 7
